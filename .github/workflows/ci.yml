name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: Branch naming
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check feat/<wbs>-<name>
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ ! "$HEAD_REF" =~ ^(feat|fix|chore|docs)/(([0-9]+(\.[0-9]+)*)|[a-z0-9]+)-[a-z0-9-]+$ ]]; then
            echo "::error::Branch '$HEAD_REF' must look like <type>/<wbs>-<name> or <type>/<scope>-<name>, e.g. feat/1.2-auth-scaffold or feat/ui-ui-reskin"
            exit 1
          fi

  api:
    name: API (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: mysql://ci:ci@localhost:3306/ci
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test

  client:
    name: Client (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker (build + compose smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the stack
        run: |
          sed -e 's/^JWT_SECRET=.*/JWT_SECRET=ci-docker-secret/' \
              -e 's/^LLM_MOCK=.*/LLM_MOCK=true/' .env.docker.example > .env
          docker compose up -d --build --wait --wait-timeout 300
      - name: Seed demo data
        run: docker compose --profile seed run --rm seed
      - name: Smoke test through nginx
        run: |
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/ | grep -qi "<div id=\"root\""
          curl -fsS http://localhost:8080/api/health
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"student@sfsh.dev","password":"Password123!"}' | jq -r .data.token)
          curl -fsS http://localhost:8080/api/recommendation/next-action -H "Authorization: Bearer $TOKEN"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

services:
  mysql:
    image: mysql:8.0
    container_name: sfsh-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: sfsh
      MYSQL_USER: sfsh
      MYSQL_PASSWORD: sfsh_password
    ports:
      - "3306:3306"
    volumes:
      - sfsh_mysql_data:/var/lib/mysql
      # Prisma migrate dev needs a shadow database; grant the app user rights to create it.
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro

volumes:
  sfsh_mysql_data:

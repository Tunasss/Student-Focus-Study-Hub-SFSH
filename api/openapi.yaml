openapi: 3.1.0
info:
  title: Student Focus & Study Hub (SFSH) API
  version: 0.1.0
  description: |
    REST API for SFSH: authentication, ICS timetable import, courses, the weekly class schedule, tasks (deadlines)
    and syllabus PDF text extraction.

    ## Response envelope (Rule 02)
    Every response, success or error, uses the same envelope:

    ```json
    { "success": true,  "data": { }, "error": null, "timestamp": "2026-10-25T00:00:00.000Z" }
    { "success": false, "data": null, "error": { "code": "VALIDATION_ERROR", "message": "..." }, "timestamp": "..." }
    ```

    ## Trying protected endpoints
    1. Call `POST /api/auth/login` (demo account `student@sfsh.dev` / `Password123!`) or `POST /api/auth/register`.
    2. Copy `data.token` from the response.
    3. Click **Authorize** at the top of this page and paste the token (without the `Bearer ` prefix).

    Tokens are JWTs valid for 24 hours. Every protected query is scoped to the token's user (Rule 06).

    ## Error codes
    | Code | HTTP | Meaning |
    |---|---|---|
    | `VALIDATION_ERROR` | 400 | A body or query parameter is invalid |
    | `INVALID_JSON` | 400 | The request body is not valid JSON |
    | `INVALID_ICS_FORMAT` | 400 | The uploaded timetable is not a usable .ics file |
    | `INVALID_PDF_FORMAT` | 400 | The uploaded syllabus is not a usable .pdf file (missing, wrong extension, over 5 MB, corrupt, encrypted) |
    | `PDF_TOO_MANY_PAGES` | 400 | The syllabus PDF has more than 30 pages |
    | `PDF_NO_TEXT_LAYER` | 422 | The syllabus PDF is a scanned image without a text layer; use the manual entry form |
    | `SYLLABUS_NO_TOPICS` | 422 | The AI found no course topics in the syllabus text; use the manual entry form |
    | `LLM_SCHEMA_INVALID` | 502 | The AI reply was not valid JSON or failed the topics schema (zod), even after one retry |
    | `LLM_UNAVAILABLE` | 503 | The AI service is out of quota (429), unreachable or rejected the key: switch to the manual entry form |
    | `LLM_NOT_CONFIGURED` | 503 | `GEMINI_API_KEY` is not set on this server |
    | `UNAUTHORIZED` | 401 | Missing, malformed or invalid bearer token |
    | `TOKEN_EXPIRED` | 401 | The bearer token has expired; log in again |
    | `INVALID_CREDENTIALS` | 401 | Wrong email or password |
    | `NOT_FOUND` | 404 | No such route, or the task / course / topic does not exist for this user |
    | `EMAIL_TAKEN` | 409 | An account with this email already exists |
    | `SORT_ORDER_TAKEN` | 409 | The course already has a topic at that `sortOrder` |
    | `INTERNAL_ERROR` | 500 | Unexpected server error |
servers:
  - url: /
    description: This server
tags:
  - name: System
  - name: Auth
    description: Register, log in and read the current user.
  - name: Schedule
    description: Import an .ics timetable and read class occurrences.
  - name: Courses
    description: The user's courses and their weekly slots.
  - name: Tasks
    description: Deadlines (assignments, labs, exams) attached to a course and optionally a syllabus topic.
  - name: Syllabus
    description: "Turn a syllabus PDF into topics (WBS 2.2): text-layer extraction, then Gemini structured output."
  - name: Topics
    description: |
      Syllabus topics (chapters) of a course and their learning status. The Gemini preview from
      `POST /api/syllabus/extract` is **not** stored: the user reviews it on the web, then the client saves the
      confirmed list with `POST /api/courses/{id}/topics/bulk`. JSON `sortOrder` maps to the `sort_order` column.

paths:
  /api/health:
    get:
      tags: [System]
      summary: Health check
      description: Public liveness probe used by the hosting platform.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: The API is up.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        additionalProperties: false
                        required: [status]
                        properties:
                          status:
                            const: ok

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      description: Creates a student account and returns a JWT so the client is logged in immediately.
      operationId: register
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: '`VALIDATION_ERROR` (invalid email, or password shorter than 8 characters) or `INVALID_JSON`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error:
                  code: VALIDATION_ERROR
                  message: Password must be at least 8 characters
                timestamp: '2026-10-25T00:00:00.000Z'
        '409':
          description: '`EMAIL_TAKEN`: an account with this email already exists.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: Exchanges email + password for a JWT (valid 24h). The email is case-insensitive.
      operationId: login
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          description: '`INVALID_CREDENTIALS`: wrong email or password.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current user
      description: Returns the user that owns the bearer token.
      operationId: getMe
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        additionalProperties: false
                        required: [user]
                        properties:
                          user:
                            $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/schedule/import:
    post:
      tags: [Schedule]
      summary: Import an .ics timetable
      description: |
        Uploads a timetable exported from Google Calendar, Outlook or the school portal and stores it as courses
        and weekly schedule slots.

        - Accepted: `.ics` extension, at most 2 MB, starts with `BEGIN:VCALENDAR`, 1–500 `VEVENT`s.
        - Supported: single events, `RRULE FREQ=WEEKLY` (`UNTIL`, `COUNT`, `INTERVAL`, `BYDAY`), `EXDATE`,
          `TZID` (IANA or Windows zone names), UTC and floating times (read in `X-WR-TIMEZONE`, default `Asia/Ho_Chi_Minh`).
        - Course recognition: a `SUMMARY` starting with a code like `CS101` or `MATH 201` is split into `code` + `name`;
          events with the same `SUMMARY` belong to the same course.
        - Re-uploading is safe: courses are upserted on the normalized `SUMMARY`, and their previously imported slots
          are replaced. Manually created courses and slots are not touched.
        - Events that cannot become a weekly class (all-day, non-weekly `RRULE`, no duration) are reported in `skipped`.
      operationId: importSchedule
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The .ics file.
      responses:
        '201':
          description: Timetable imported.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ImportResult'
        '400':
          description: |
            `INVALID_ICS_FORMAT`: missing file, wrong extension, larger than 2 MB, no `BEGIN:VCALENDAR` header,
            no or more than 500 `VEVENT`s, unparseable content, or no importable class events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error:
                  code: INVALID_ICS_FORMAT
                  message: File is larger than 2 MB
                timestamp: '2026-10-25T00:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/schedule:
    get:
      tags: [Schedule]
      summary: Class occurrences in a date range
      description: |
        Expands the user's weekly slots into concrete classes in `[from, to)`, honouring `recurrenceUntil`,
        `intervalWeeks` and `exdates`, and converts them to `tz`. Sorted by start time.
      operationId: getSchedule
      parameters:
        - name: from
          in: query
          description: First day (inclusive), local to `tz`. Defaults to Monday of the current week.
          schema:
            type: string
            format: date
          example: '2026-11-09'
        - name: to
          in: query
          description: Last day (exclusive), local to `tz`. Defaults to `from` + 7 days. The range is at most 62 days.
          schema:
            type: string
            format: date
          example: '2026-11-16'
        - name: tz
          in: query
          description: IANA timezone to display times in.
          schema:
            type: string
            default: Asia/Ho_Chi_Minh
      responses:
        '200':
          description: Class occurrences in the range.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ScheduleRange'
        '400':
          description: '`VALIDATION_ERROR`: bad `tz`, bad date, `to` not after `from`, or range longer than 62 days.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/courses:
    get:
      tags: [Courses]
      summary: List courses
      description: The user's courses, ordered by code then name, each with its weekly slots (ordered by weekday, start time).
      operationId: listCourses
      responses:
        '200':
          description: The user's courses.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        additionalProperties: false
                        required: [courses]
                        properties:
                          courses:
                            type: array
                            items:
                              $ref: '#/components/schemas/Course'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/tasks:
    get:
      tags: [Tasks]
      summary: List tasks
      description: |
        The user's tasks ordered by due date (soonest first), optionally filtered by course and status.
        Only the caller's tasks are ever returned (Rule 06). Each task carries `daysLeft` and `urgencyBadge`,
        computed from the server clock at request time.
      operationId: listTasks
      parameters:
        - name: course_id
          in: query
          description: Only tasks of this course. `courseId` is accepted as an alias.
          schema:
            type: integer
            minimum: 1
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TaskStatus'
      responses:
        '200':
          description: The user's tasks.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        additionalProperties: false
                        required: [tasks]
                        properties:
                          tasks:
                            type: array
                            items:
                              $ref: '#/components/schemas/Task'
        '400':
          description: '`VALIDATION_ERROR`: `course_id` is not a positive integer or `status` is not a known status.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Tasks]
      summary: Create a task
      description: |
        Creates a task for one of the caller's courses. `topicId`, when given, must be a topic of that course.
        A course or topic that belongs to another user is reported as `404 NOT_FOUND`.
      operationId: createTask
      requestBody:
        $ref: '#/components/requestBodies/TaskInput'
      responses:
        '201':
          description: Task created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/TaskValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TaskNotFound'

  /api/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    put:
      tags: [Tasks]
      summary: Replace a task
      description: |
        Replaces the whole task. Omitted optional fields fall back to their defaults
        (`topicId` → `null`, `status` → `TODO`). Use `PATCH` to change single fields.
      operationId: replaceTask
      requestBody:
        $ref: '#/components/requestBodies/TaskInput'
      responses:
        '200':
          description: Task replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/TaskValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TaskNotFound'
    patch:
      tags: [Tasks]
      summary: Update a task
      description: |
        Changes one or more fields, typically the status (`{ "status": "DONE" }`).
        When `courseId` changes, the current `topicId` must belong to the new course or be set to `null`.
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskPatch'
            example:
              status: DONE
      responses:
        '200':
          description: Task updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/TaskValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TaskNotFound'
    delete:
      tags: [Tasks]
      summary: Delete a task
      description: Deletes the task. Focus sessions that referenced it are kept with `task_id = null`.
      operationId: deleteTask
      responses:
        '200':
          description: Task deleted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        additionalProperties: false
                        required: [id]
                        properties:
                          id:
                            type: integer
                            description: Id of the deleted task.
        '400':
          description: '`VALIDATION_ERROR`: `id` is not a positive integer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TaskNotFound'

  /api/syllabus/extract:
    post:
      tags: [Syllabus]
      summary: Extract topics from a syllabus PDF
      description: |
        Uploads a syllabus PDF, reads its text layer and asks Gemini (`GEMINI_MODEL`, a Flash model) for the course
        code and the ordered list of topics. The reply is forced to JSON (`responseMimeType: application/json` +
        a fixed `responseSchema`) and re-validated with zod before it is returned.

        - Accepted: `.pdf` extension, at most 5 MB, at most 30 pages, `%PDF-` header, not password protected.
        - Text is read with `pdf-parse`; runs of spaces are collapsed and blank lines dropped.
        - **Scanned PDFs**: when fewer than 200 non-whitespace characters can be read from the whole file, the
          pipeline stops with `422 PDF_NO_TEXT_LAYER`. The message tells the user to add the topics with the
          manual entry form instead.
        - Topics are sorted by the model's `order`, de-duplicated by title and renumbered from 1, ready to become
          `topics.sort_order`. `courseCode` is null when the syllabus has none.
        - The raw `text` and per-page `pages` are returned as well, so the client can show the source.

        Resilience (WBS 2.2.3): a reply that fails the schema is retried once, then `502 LLM_SCHEMA_INVALID`.
        Quota (429) or connection problems answer `503 LLM_UNAVAILABLE` immediately, so the client should open the
        manual entry form. With `LLM_MOCK=true` the server skips Gemini and returns a fixed 5-chapter sample
        (`source: mock`).
      operationId: extractSyllabus
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The syllabus .pdf file.
      responses:
        '200':
          description: Text layer extracted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SyllabusText'
        '400':
          description: |
            `INVALID_PDF_FORMAT` (missing file, wrong field or extension, over 5 MB, no `%PDF-` header, corrupt
            or password protected) or `PDF_TOO_MANY_PAGES` (more than 30 pages).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error:
                  code: PDF_TOO_MANY_PAGES
                  message: PDF has 31 pages; the limit is 30
                timestamp: '2026-11-06T00:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: |
            The file was read but no topics can be produced; the message points the user to the manual entry form.
            `PDF_NO_TEXT_LAYER`: scanned (image-only) PDF, fewer than 200 characters of text.
            `SYLLABUS_NO_TOPICS`: the AI found no course topics in the text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error:
                  code: PDF_NO_TEXT_LAYER
                  message: This PDF has no readable text layer (it looks like a scanned image). Please add the syllabus topics with the manual entry form instead.
                timestamp: '2026-11-06T00:00:00.000Z'
        '502':
          description: '`LLM_SCHEMA_INVALID`: the AI reply was not valid JSON or failed the topics schema twice (one retry).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error:
                  code: LLM_SCHEMA_INVALID
                  message: 'The AI reply did not match the expected syllabus structure after 2 attempts (topics.0.title: Invalid input: expected string, received undefined); please add the topics manually'
                timestamp: '2026-11-06T00:00:00.000Z'
        '503':
          description: |
            `LLM_UNAVAILABLE` (out of quota / HTTP 429, unreachable, or key rejected) or `LLM_NOT_CONFIGURED`
            (no `GEMINI_API_KEY`). The client should open the manual entry form right away.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error:
                  code: LLM_UNAVAILABLE
                  message: The AI service is out of quota or rate limited; please add the topics manually or try again later
                timestamp: '2026-11-06T00:00:00.000Z'

  /api/courses/{id}/topics:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Topics]
      summary: List the topics of a course
      description: The course's syllabus topics ordered by `sortOrder`. The course must belong to the caller.
      operationId: listCourseTopics
      responses:
        '200':
          description: The course's topics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicListResponse'
        '400':
          $ref: '#/components/responses/TopicValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CourseNotFound'
    post:
      tags: [Topics]
      summary: Add one topic
      description: |
        Adds a single topic (the manual entry form). Without `sortOrder` it is appended after the last topic;
        with one, that position must be free.
      operationId: createTopic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicInput'
      responses:
        '201':
          description: Topic created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicResponse'
        '400':
          $ref: '#/components/responses/TopicValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CourseNotFound'
        '409':
          description: '`SORT_ORDER_TAKEN`: the course already has a topic at that `sortOrder`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/courses/{id}/topics/bulk:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    post:
      tags: [Topics]
      summary: Save the reviewed syllabus topics
      description: |
        Writes the whole list the user confirmed on the web into the course's `topics` table, in one transaction.
        The previous topic list of that course is replaced; learning status is carried over from an existing topic
        with the same title (case-insensitive) unless the item sets `status`. Tasks and focus sessions that pointed
        at removed topics keep running with `topic_id = null`.

        Items are sorted by `order` (the Gemini preview field) or `sortOrder` (array position when neither is
        given) and renumbered 1..n into `sort_order`, so the stored positions are unique and gap-free.
      operationId: bulkSaveTopics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicBulkInput'
            example:
              topics:
                - order: 1
                  title: 'Chapter 1: Introduction to Programming'
                  description: What programs are, the development cycle.
                - order: 2
                  title: 'Chapter 2: Variables, Types and Expressions'
      responses:
        '201':
          description: Topics saved; the course's new list in `sortOrder`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        additionalProperties: false
                        required: [topics, replaced]
                        properties:
                          topics:
                            type: array
                            items:
                              $ref: '#/components/schemas/Topic'
                          replaced:
                            type: integer
                            minimum: 0
                            description: Number of topics the course had before this save.
        '400':
          $ref: '#/components/responses/TopicValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CourseNotFound'

  /api/topics/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Topic id. A topic of another user's course is reported as `404 NOT_FOUND`.
        schema:
          type: integer
          minimum: 1
    patch:
      tags: [Topics]
      summary: Update a topic
      description: |
        Changes the learning status (`TODO` → `DOING` → `DONE`) or quick-edits the title / description from the
        topic card. At least one field; `sortOrder` cannot be changed here.
      operationId: updateTopic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicPatch'
            example:
              status: DOING
      responses:
        '200':
          description: Topic updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicResponse'
        '400':
          $ref: '#/components/responses/TopicValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TopicNotFound'
    delete:
      tags: [Topics]
      summary: Delete a topic
      description: Deletes the topic. Tasks and focus sessions that referenced it are kept with `topic_id = null`.
      operationId: deleteTopic
      responses:
        '200':
          description: Topic deleted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        additionalProperties: false
                        required: [id]
                        properties:
                          id:
                            type: integer
        '400':
          $ref: '#/components/responses/TopicValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TopicNotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from `POST /api/auth/login` or `POST /api/auth/register` (`data.token`).

  parameters:
    CourseId:
      name: id
      in: path
      required: true
      description: Course id. Another user's course is reported as `404 NOT_FOUND`.
      schema:
        type: integer
        minimum: 1
    TaskId:
      name: id
      in: path
      required: true
      description: Task id. Another user's task is reported as `404 NOT_FOUND`.
      schema:
        type: integer
        minimum: 1

  requestBodies:
    TaskInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaskInput'
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email:
                type: string
                format: email
                example: student@sfsh.dev
              password:
                type: string
                minLength: 8
                example: Password123!

  responses:
    Unauthorized:
      description: '`UNAUTHORIZED` (missing or invalid bearer token) or `TOKEN_EXPIRED`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error:
              code: UNAUTHORIZED
              message: Missing bearer token
            timestamp: '2026-10-25T00:00:00.000Z'
    InvalidJson:
      description: '`INVALID_JSON`: the request body is not valid JSON.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TaskValidationError:
      description: |
        `VALIDATION_ERROR` (missing or malformed field, unknown key, bad `id`) or `INVALID_JSON`.
        The message names the field, e.g. `dueAt: must be an ISO-8601 date-time with timezone`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error:
              code: VALIDATION_ERROR
              message: 'dueAt: must be an ISO-8601 date-time with timezone, e.g. 2026-11-20T23:59:00+07:00'
            timestamp: '2026-11-06T00:00:00.000Z'
    TopicValidationError:
      description: '`VALIDATION_ERROR` (missing or malformed field, unknown key, bad `id`) or `INVALID_JSON`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CourseNotFound:
      description: '`NOT_FOUND`: the course does not exist for this user.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TopicNotFound:
      description: '`NOT_FOUND`: the topic does not exist for this user.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TaskNotFound:
      description: '`NOT_FOUND`: the task, course or topic does not exist for this user.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error:
              code: NOT_FOUND
              message: Task not found
            timestamp: '2026-11-06T00:00:00.000Z'

  schemas:
    SuccessEnvelope:
      type: object
      description: Rule 02 envelope for a successful response. `data` holds the payload.
      required: [success, data, error, timestamp]
      properties:
        success:
          const: true
        data: {}
        error:
          type: 'null'
        timestamp:
          type: string
          format: date-time
          example: '2026-10-25T00:00:00.000Z'

    ErrorEnvelope:
      type: object
      description: Rule 02 envelope for a failed response.
      additionalProperties: false
      required: [success, data, error, timestamp]
      properties:
        success:
          const: false
        data:
          type: 'null'
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - INVALID_JSON
                - INVALID_ICS_FORMAT
                - INVALID_PDF_FORMAT
                - PDF_TOO_MANY_PAGES
                - PDF_NO_TEXT_LAYER
                - SYLLABUS_NO_TOPICS
                - LLM_SCHEMA_INVALID
                - LLM_UNAVAILABLE
                - LLM_NOT_CONFIGURED
                - UNAUTHORIZED
                - TOKEN_EXPIRED
                - INVALID_CREDENTIALS
                - NOT_FOUND
                - EMAIL_TAKEN
                - SORT_ORDER_TAKEN
                - INTERNAL_ERROR
            message:
              type: string
              description: Human-readable explanation.
        timestamp:
          type: string
          format: date-time

    User:
      type: object
      additionalProperties: false
      required: [id, email, createdAt]
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: student@sfsh.dev
        createdAt:
          type: string
          format: date-time

    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              additionalProperties: false
              required: [token, user]
              properties:
                token:
                  type: string
                  description: JWT, valid for 24 hours. Send as `Authorization Bearer <token>`.
                user:
                  $ref: '#/components/schemas/User'

    ImportResult:
      type: object
      additionalProperties: false
      required: [eventsRead, coursesCreated, coursesUpdated, schedulesImported, courses, skipped]
      properties:
        eventsRead:
          type: integer
          description: Number of VEVENTs in the file.
          example: 6
        coursesCreated:
          type: integer
          example: 5
        coursesUpdated:
          type: integer
          description: Courses that already existed (same normalized SUMMARY) and were refreshed.
          example: 0
        schedulesImported:
          type: integer
          description: Weekly slots written (one per VEVENT and weekday).
          example: 6
        courses:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, code, name, schedules, status]
            properties:
              id:
                type: integer
              code:
                type: [string, 'null']
                example: CS101
              name:
                type: string
                example: Introduction to Programming
              schedules:
                type: integer
                description: Number of weekly slots imported for this course.
              status:
                type: string
                enum: [created, updated]
        skipped:
          type: array
          description: Events that were not imported, with the reason.
          items:
            type: object
            additionalProperties: false
            required: [uid, summary, reason]
            properties:
              uid:
                type: [string, 'null']
              summary:
                type: [string, 'null']
              reason:
                type: string
                example: All-day events are not class sessions

    Course:
      type: object
      additionalProperties: false
      required: [id, code, name, schedules]
      properties:
        id:
          type: integer
        code:
          type: [string, 'null']
          description: Course code split from the SUMMARY, or null if none was found.
          example: CS101
        name:
          type: string
          example: Introduction to Programming
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleSlot'

    ScheduleSlot:
      type: object
      description: One weekly slot. Wall-clock fields are in the slot's original timezone `tz`.
      additionalProperties: false
      required:
        - id
        - dayOfWeek
        - startTime
        - endTime
        - location
        - tz
        - recurrenceUntil
        - intervalWeeks
        - startsAtUtc
        - endsAtUtc
        - exdates
        - source
      properties:
        id:
          type: integer
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
          description: ISO weekday, 1 = Monday … 7 = Sunday.
        startTime:
          type: string
          pattern: '^\d{2}:\d{2}:\d{2}$'
          example: '07:30:00'
        endTime:
          type: string
          pattern: '^\d{2}:\d{2}:\d{2}$'
          example: '09:30:00'
        location:
          type: [string, 'null']
          example: Room A101
        tz:
          type: string
          description: IANA timezone the slot was defined in.
          example: Asia/Ho_Chi_Minh
        recurrenceUntil:
          type: [string, 'null']
          format: date
          description: Last class date (local), or null when the series has no end.
        intervalWeeks:
          type: integer
          minimum: 1
          description: 1 = every week, 2 = every other week, …
        startsAtUtc:
          type: [string, 'null']
          format: date-time
          description: First occurrence start in UTC (null for manual slots).
        endsAtUtc:
          type: [string, 'null']
          format: date-time
        exdates:
          type: array
          description: Cancelled occurrence starts (UTC).
          items:
            type: string
            format: date-time
        source:
          type: string
          enum: [ics, manual]

    ScheduleRange:
      type: object
      additionalProperties: false
      required: [tz, from, to, events]
      properties:
        tz:
          type: string
          example: Asia/Ho_Chi_Minh
        from:
          type: string
          format: date
          example: '2026-11-09'
        to:
          type: string
          format: date
          example: '2026-11-16'
        events:
          type: array
          items:
            $ref: '#/components/schemas/ClassOccurrence'

    ClassOccurrence:
      type: object
      additionalProperties: false
      required:
        - scheduleId
        - courseId
        - courseCode
        - courseName
        - location
        - startUtc
        - endUtc
        - start
        - end
        - dayOfWeek
        - sourceTz
      properties:
        scheduleId:
          type: integer
        courseId:
          type: integer
        courseCode:
          type: [string, 'null']
          example: CS101
        courseName:
          type: [string, 'null']
          example: Introduction to Programming
        location:
          type: [string, 'null']
          example: Room A101
        startUtc:
          type: string
          format: date-time
          example: '2026-11-09T00:30:00.000Z'
        endUtc:
          type: string
          format: date-time
        start:
          type: string
          description: Local start in the requested `tz` (YYYY-MM-DDTHH:mm).
          example: '2026-11-09T07:30'
        end:
          type: string
          example: '2026-11-09T09:30'
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
          description: ISO weekday in the requested `tz`.
        sourceTz:
          type: string
          description: Timezone the slot was defined in.
          example: Asia/Ho_Chi_Minh

    TaskStatus:
      type: string
      enum: [TODO, DOING, DONE, OVERDUE]

    UrgencyBadge:
      type: [string, 'null']
      enum: [OVERDUE, URGENT, SOON, LATER, null]
      description: |
        Computed at response time from `dueAt` and the server clock (never stored):

        - `OVERDUE`: `dueAt` is in the past and the task is not `DONE`
        - `URGENT`: `daysLeft` < 3
        - `SOON`: 3 ≤ `daysLeft` ≤ 7
        - `LATER`: `daysLeft` > 7
        - `null`: the task is `DONE`

    Task:
      type: object
      additionalProperties: false
      required: [id, title, dueAt, status, daysLeft, urgencyBadge, courseId, topicId, course, topic, createdAt]
      properties:
        id:
          type: integer
          example: 12
        title:
          type: string
          example: 'CS101 Lab 3: Functions exercises'
        dueAt:
          type: string
          format: date-time
          example: '2026-11-20T16:59:00.000Z'
        status:
          $ref: '#/components/schemas/TaskStatus'
        daysLeft:
          type: integer
          description: '`ceil((dueAt - now) / 24h)`: 0 when due within the current day, negative once overdue.'
          example: 2
        urgencyBadge:
          $ref: '#/components/schemas/UrgencyBadge'
        courseId:
          type: integer
        topicId:
          type: [integer, 'null']
        course:
          type: object
          additionalProperties: false
          required: [id, code, name]
          properties:
            id:
              type: integer
            code:
              type: [string, 'null']
              example: CS101
            name:
              type: string
              example: Introduction to Programming
        topic:
          type: [object, 'null']
          additionalProperties: false
          required: [id, title]
          properties:
            id:
              type: integer
            title:
              type: string
              example: Functions
        createdAt:
          type: string
          format: date-time

    TaskInput:
      type: object
      description: Body of `POST /api/tasks` and `PUT /api/tasks/{id}`. Unknown keys are rejected.
      additionalProperties: false
      required: [title, dueAt, courseId]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          example: 'CS101 Lab 3: Functions exercises'
        dueAt:
          type: string
          format: date-time
          description: ISO-8601 with an explicit offset or `Z`.
          example: '2026-11-20T23:59:00+07:00'
        courseId:
          type: integer
          minimum: 1
          description: One of the caller's courses.
        topicId:
          type: [integer, 'null']
          minimum: 1
          default: null
          description: A topic of `courseId`.
        status:
          allOf:
            - $ref: '#/components/schemas/TaskStatus'
          default: TODO

    TaskPatch:
      type: object
      description: Body of `PATCH /api/tasks/{id}`. Any subset of the task fields, at least one. Unknown keys are rejected.
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        dueAt:
          type: string
          format: date-time
        courseId:
          type: integer
          minimum: 1
        topicId:
          type: [integer, 'null']
          minimum: 1
        status:
          $ref: '#/components/schemas/TaskStatus'

    TaskResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              additionalProperties: false
              required: [task]
              properties:
                task:
                  $ref: '#/components/schemas/Task'

    SyllabusSubtopic:
      type: object
      additionalProperties: false
      required: [order, title]
      properties:
        order:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: [string, 'null']
          maxLength: 1000

    SyllabusChapter:
      type: object
      additionalProperties: false
      required: [order, title, subtopics]
      properties:
        order:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: [string, 'null']
          maxLength: 1000
        sourceFile:
          type: [string, 'null']
          maxLength: 255
        subtopics:
          type: array
          items:
            $ref: '#/components/schemas/SyllabusSubtopic'

    SyllabusTopic:
      type: object
      additionalProperties: false
      required: [order, title, description]
      properties:
        order:
          type: integer
          minimum: 1
          description: 1-based position; consecutive.
        title:
          type: string
          minLength: 1
          maxLength: 255
          example: Techniques of integration
        description:
          type: [string, 'null']
          maxLength: 1000
          example: Substitution, integration by parts, partial fractions.

    SyllabusText:
      type: object
      additionalProperties: false
      required: [fileName, pageCount, charCount, courseCode, topics, source, text, pages]
      properties:
        fileName:
          type: string
          example: MATH201-syllabus.pdf
        fileNames:
          type: array
          items:
            type: string
        pageCount:
          type: integer
          minimum: 1
          maximum: 30
          example: 3
        charCount:
          type: integer
          minimum: 200
          description: Non-whitespace characters in `text`.
          example: 2840
        courseCode:
          type: [string, 'null']
          description: Course code found by the model, e.g. MATH201; null when the syllabus shows none.
          example: MATH201
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/SyllabusChapter'
        topics:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/SyllabusTopic'
        source:
          type: string
          enum: [gemini, mock]
          description: '`mock` when the server runs with `LLM_MOCK=true` (fixed sample, Gemini not called).'
        text:
          type: string
          description: Text of all pages, pages separated by a blank line.
          example: "MATH201 Calculus II\nWeek 1-2: Techniques of integration\n\nWeek 3-4: Improper integrals"
        pages:
          type: array
          description: Text per page, in page order.
          items:
            type: object
            additionalProperties: false
            required: [page, text]
            properties:
              page:
                type: integer
                minimum: 1
              text:
                type: string
        files:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [fileName, text, pageCount, charCount]
            properties:
              fileName:
                type: string
              text:
                type: string
              pageCount:
                type: integer
              charCount:
                type: integer

    TopicStatus:
      type: string
      enum: [TODO, DOING, DONE]

    Topic:
      type: object
      additionalProperties: false
      required: [id, courseId, parentId, sortOrder, title, description, sourceFile, status]
      properties:
        id:
          type: integer
        courseId:
          type: integer
        parentId:
          type: [integer, 'null']
        sortOrder:
          type: integer
          minimum: 1
          description: Position in the syllabus (column `sort_order`).
        title:
          type: string
          example: 'Chapter 3: Control Flow'
        description:
          type: [string, 'null']
        sourceFile:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/TopicStatus'

    TopicInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: [string, 'null']
          maxLength: 2000
        sourceFile:
          type: [string, 'null']
        parentId:
          type: [integer, 'null']
        status:
          allOf:
            - $ref: '#/components/schemas/TopicStatus'
          default: TODO
        sortOrder:
          type: integer
          minimum: 1
          description: Position; defaults to the next free one.

    TopicBulkInput:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [append, replace]
          default: append
        chapters:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [title]
            properties:
              order:
                type: integer
              sortOrder:
                type: integer
              title:
                type: string
              description:
                type: [string, 'null']
              sourceFile:
                type: [string, 'null']
              status:
                $ref: '#/components/schemas/TopicStatus'
              subtopics:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [title]
                  properties:
                    order:
                      type: integer
                    sortOrder:
                      type: integer
                    title:
                      type: string
                    description:
                      type: [string, 'null']
                    status:
                      $ref: '#/components/schemas/TopicStatus'
        topics:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [title]
            properties:
              order:
                type: integer
                minimum: 1
                description: Position as in the Gemini preview.
              sortOrder:
                type: integer
                minimum: 1
                description: Alias of `order`.
              title:
                type: string
                minLength: 1
                maxLength: 255
              description:
                type: [string, 'null']
                maxLength: 2000
              sourceFile:
                type: [string, 'null']
              parentId:
                type: [integer, 'null']
              status:
                $ref: '#/components/schemas/TopicStatus'

    TopicPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: [string, 'null']
          maxLength: 2000
        status:
          $ref: '#/components/schemas/TopicStatus'

    TopicResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              additionalProperties: false
              required: [topic]
              properties:
                topic:
                  $ref: '#/components/schemas/Topic'

    TopicListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              additionalProperties: false
              required: [topics]
              properties:
                topics:
                  type: array
                  items:
                    $ref: '#/components/schemas/Topic'

security:
  - bearerAuth: []

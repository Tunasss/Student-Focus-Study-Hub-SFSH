<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Main Crown Petal Gradient -->
    <linearGradient id="luma-crown" x1="16" y1="4" x2="16" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#EEF9B2" />
      <stop offset="70%" stop-color="#DBEF90" />
      <stop offset="100%" stop-color="#9AB82C" />
    </linearGradient>

    <!-- Outer Wings Gradient -->
    <linearGradient id="luma-wings" x1="7" y1="9" x2="25" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DBEF90" />
      <stop offset="50%" stop-color="#BEDC58" />
      <stop offset="100%" stop-color="#6C8614" />
    </linearGradient>

    <!-- Base Cradle Crescent Gradient -->
    <linearGradient id="luma-cradle" x1="7" y1="22" x2="25" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7E9F15" />
      <stop offset="50%" stop-color="#DBEF90" />
      <stop offset="100%" stop-color="#7E9F15" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Icon Background disc with high contrast on both dark & light browser chrome -->
  <rect width="32" height="32" rx="7.5" fill="#0C1303" />

  <!-- Luma Radiant Lotus Emblem -->
  <g transform="translate(16, 17) scale(0.16) translate(-100, -104)">
    <!-- Outer Left Wing Petal -->
    <path
      d="M66 76 C46 95 38 120 54 142 C70 131 80 113 78 94 Z"
      fill="url(#luma-wings)"
    />
    <!-- Outer Right Wing Petal -->
    <path
      d="M134 76 C154 95 162 120 146 142 C130 131 120 113 122 94 Z"
      fill="url(#luma-wings)"
    />

    <!-- Inner Left Petal -->
    <path
      d="M86 50 C68 66 58 90 72 120 C87 111 96 92 92 70 Z"
      fill="#DBEF90"
      opacity="0.92"
    />
    <!-- Inner Right Petal -->
    <path
      d="M114 50 C132 66 142 90 128 120 C113 111 104 92 108 70 Z"
      fill="#DBEF90"
      opacity="0.92"
    />

    <!-- Central Tall Crown Petal -->
    <path
      d="M100 24 C89 54 89 88 100 118 C111 88 111 54 100 24 Z"
      fill="url(#luma-crown)"
    />
    <line
      x1="100"
      y1="28"
      x2="100"
      y2="114"
      stroke="#FFFFFF"
      stroke-width="1.8"
      stroke-linecap="round"
      opacity="0.6"
    />

    <!-- Base Cradle Crescent Petal -->
    <path
      d="M48 144 C72 172 128 172 152 144 C136 163 64 163 48 144 Z"
      fill="url(#luma-cradle)"
    />

    <!-- Central Sacred Diamond Spark -->
    <polygon
      points="100,96 107,108 100,120 93,108"
      fill="#FFFFFF"
    />
    <circle cx="100" cy="108" r="2.8" fill="#243100" />
  </g>
</svg>

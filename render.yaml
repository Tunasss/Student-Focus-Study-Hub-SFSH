# Render Blueprint for the SFSH API (root directory: api).
# MySQL is hosted elsewhere (Render has no managed MySQL) — set DATABASE_URL in the dashboard.
services:
  - type: web
    name: sfsh-api
    runtime: node
    rootDir: api
    plan: free
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
